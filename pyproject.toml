[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "force-sismique"
version = "0.1.1"
description = "Calcul de la force sismique équivalente selon la RPS 2011 (Règlement Parasismique Marocain)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "rps",
    "rps-2011",
    "sismique",
    "parasismique",
    "force-sismique",
    "maroc",
    "structure",
    "genie-civil",
    "beton-arme",
]
authors = [{ name = "rianastellia" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
latex = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pyflakes"]
build = ["pyinstaller>=6.10"]

[project.scripts]
main = "lancer:main"

[tool.setuptools]
packages = ["rps", "interface"]
py-modules = ["affichage", "lancer", "exemple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
